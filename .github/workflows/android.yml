name: Build APP LOCK APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'APP-LOCK-Android.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract project
        run: unzip -o APP-LOCK-Android.zip -d .

      - name: Build APK
        run: |
          cd APP-LOCK-Android
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APP-LOCK-APK
          path: APP-LOCK-Android/app/build/outputs/apk/debug/app-debug.apk
